product_qualification:
  - product_id: "IMPD-AUTOMATION"
    name: "IMPD automation"
    repository: "Zeuthens/impd-automation"
    medical_device: false
    determination: "Not a medical device."
    rationale: >-
      IMPD automation drafts regulatory dossier content (Investigational Medicinal
      Product Dossiers) for medicinal products on behalf of pharmaceutical
      regulatory professionals. It has no medical purpose: it is not intended for
      diagnosis, prevention, monitoring, prediction, prognosis, treatment, or
      alleviation of disease or injury in individual patients, and it does not
      process patient data to support clinical decisions. It therefore does not
      meet the medical device software definition of Regulation (EU) 2017/745
      Article 2(1).
    confirmation_status: "TODO: confirm the non-device determination and record approval (SOP-005); re-assess under SOP-009 if any medical purpose or clinical claim is added."
    escalation_rule: "If AI output is used for a medical purpose or the product makes a diagnostic or therapeutic claim, re-evaluate the adoption profile (escalate to the source baseline's ai_diagnostic profile) before release."
